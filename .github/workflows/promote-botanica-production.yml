name: Promote BOTANICA Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-botanica-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Detect Vercel token
        id: token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm install --global vercel@56.5.0

      - name: Promote exact validated BOTANICA artifact
        id: promote
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel promote autonomous-dropshipping-business-5ql0w5umi.vercel.app \
            --token="$VERCEL_TOKEN" \
            --scope="juan-gonzalezs-projects-94b6dfe9" \
            --yes

      - name: Alias production domain to exact artifact
        id: alias
        if: steps.token.outputs.present == 'true' && steps.promote.outcome != 'success'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel alias set autonomous-dropshipping-business-5ql0w5umi.vercel.app www.botanicaochosi.com \
            --token="$VERCEL_TOKEN" \
            --scope="juan-gonzalezs-projects-94b6dfe9"

      - name: Verify production domain and Spanish library
        id: verify
        if: steps.promote.outcome == 'success' || steps.alias.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            OWNER=$(curl --fail --silent --show-error --location https://www.botanicaochosi.com/owner/biblioteca-espanol || true)
            STORE=$(curl --fail --silent --show-error --location https://www.botanicaochosi.com/shop || true)
            if [ -n "$OWNER" ] && [ -n "$STORE" ]; then
              if printf '%s' "$OWNER" | grep -Fq 'BIBLIOTECA EN ESPAÑOL' && \
                 printf '%s' "$OWNER" | grep -Fq 'Los Meyi' && \
                 printf '%s' "$OWNER" | grep -Fq 'El Monte'; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Spanish literature artifact not detected on production domain"
          exit 1

      - name: Report promotion result
        if: always()
        uses: actions/github-script@v7
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          ALIAS_OUTCOME: ${{ steps.alias.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const releaseOk = process.env.PROMOTE_OUTCOME === 'success' || process.env.ALIAS_OUTCOME === 'success';
            const success = process.env.TOKEN_PRESENT === 'true' && releaseOk && process.env.VERIFY_OUTCOME === 'success';
            const title = `BOTANICA Spanish library release ${success ? 'SUCCESS' : 'FAILED'} — run ${context.runId}`;
            const body = [
              `Artifact: autonomous-dropshipping-business-5ql0w5umi.vercel.app`,
              `Deployment: dpl_EWceh7yPGi5PmBnjfABsJUuU4Lw7`,
              `Commit: 7146d82a89caf1e29cc66ba2bc6c7334034441f5`,
              `Token present: ${process.env.TOKEN_PRESENT}`,
              `Promote outcome: ${process.env.PROMOTE_OUTCOME || 'not-run'}`,
              `Alias fallback outcome: ${process.env.ALIAS_OUTCOME || 'not-run'}`,
              `Domain verification: ${process.env.VERIFY_OUTCOME || 'not-run'}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

      - name: Enforce successful release
        if: always()
        shell: bash
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          ALIAS_OUTCOME: ${{ steps.alias.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$TOKEN_PRESENT" = "true" || { echo "VERCEL_TOKEN secret is missing"; exit 1; }
          if [ "$PROMOTE_OUTCOME" != "success" ] && [ "$ALIAS_OUTCOME" != "success" ]; then
            echo "neither vercel promote nor alias fallback succeeded"
            exit 1
          fi
          test "$VERIFY_OUTCOME" = "success" || { echo "production domain verification failed"; exit 1; }
