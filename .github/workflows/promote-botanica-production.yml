name: Promote BOTANICA Production

# Promotion names the artifact it promotes, every time.
#
# This workflow used to hardcode one deployment URL and also fire on any push
# touching this file. Both were wrong together: the pinned artifact aged out of
# the deployment list, so running it would have published long-stale code over
# the live site, and the push trigger meant editing this file could do that by
# itself. The URL is now a required input, and there is no automatic trigger.
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Deployment URL to promote, e.g. autonomous-dropshipping-business-6dgb2cr2i.vercel.app (find it in the Vercel dashboard or `vercel ls`)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Detect Vercel token
        id: token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm install --global vercel@56.5.0

      - name: Promote validated BOTANICA artifact
        id: promote
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          vercel promote "$ARTIFACT" \
            --token="$VERCEL_TOKEN" \
            --scope="juan-gonzalezs-projects-94b6dfe9" \
            --yes

      - name: Verify production domain
        id: verify
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --location https://www.botanicaochosi.com/shop >/dev/null
          curl --fail --silent --show-error --location https://www.botanicaochosi.com/manifest.webmanifest >/dev/null
          curl --fail --silent --show-error --location https://www.botanicaochosi.com/sw.js >/dev/null

      - name: Report promotion result
        if: always()
        uses: actions/github-script@v7
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ARTIFACT: ${{ inputs.artifact }}
        with:
          script: |
            const success = process.env.TOKEN_PRESENT === 'true' && process.env.PROMOTE_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success';
            const title = `BOTANICA production promotion ${success ? 'SUCCESS' : 'FAILED'} — run ${context.runId}`;
            const body = [
              `Artifact: ${process.env.ARTIFACT}`,
              `Token present: ${process.env.TOKEN_PRESENT}`,
              `Promotion outcome: ${process.env.PROMOTE_OUTCOME || 'not-run'}`,
              `Domain verification: ${process.env.VERIFY_OUTCOME || 'not-run'}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

      - name: Enforce successful promotion
        if: always()
        shell: bash
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$TOKEN_PRESENT" = "true" || { echo "VERCEL_TOKEN secret is missing"; exit 1; }
          test "$PROMOTE_OUTCOME" = "success" || { echo "vercel promote failed"; exit 1; }
          test "$VERIFY_OUTCOME" = "success" || { echo "production domain verification failed"; exit 1; }
