name: Promote BOTANICA Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-botanica-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Detect Vercel token
        id: token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm install --global vercel@56.5.0

      - name: Promote validated BOTANICA artifact
        id: promote
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel promote autonomous-dropshipping-business-d4wvxwnm6.vercel.app \
            --token="$VERCEL_TOKEN" \
            --scope="juan-gonzalezs-projects-94b6dfe9" \
            --yes

      - name: Verify production domain and perfect-circle CSS
        id: verify
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://www.botanicaochosi.com/manifest.webmanifest >/dev/null
          curl --fail --silent --show-error --location https://www.botanicaochosi.com/sw.js >/dev/null
          for i in {1..12}; do
            HTML=$(curl --fail --silent --show-error --location https://www.botanicaochosi.com/shop || true)
            if [ -n "$HTML" ]; then
              CSS_PATHS=$(printf '%s' "$HTML" | grep -oE '/_next/static/css/[^" ]+\.css' | sort -u || true)
              FOUND=0
              while IFS= read -r CSS_PATH; do
                [ -n "$CSS_PATH" ] || continue
                CSS=$(curl --fail --silent --show-error "https://www.botanicaochosi.com$CSS_PATH" || true)
                if printf '%s' "$CSS" | grep -Fq 'background-size:142% auto!important' && \
                   printf '%s' "$CSS" | grep -Fq 'border-radius:50%!important' && \
                   printf '%s' "$CSS" | grep -Fq 'width:54px!important'; then
                  FOUND=1
                  break
                fi
              done <<< "$CSS_PATHS"
              if [ "$FOUND" = "1" ]; then exit 0; fi
            fi
            sleep 5
          done
          echo "Perfect-circle production CSS not detected"
          exit 1

      - name: Report promotion result
        if: always()
        uses: actions/github-script@v7
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const success = process.env.TOKEN_PRESENT === 'true' && process.env.PROMOTE_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success';
            const title = `BOTANICA production promotion ${success ? 'SUCCESS' : 'FAILED'} — run ${context.runId}`;
            const body = [
              `Artifact: autonomous-dropshipping-business-d4wvxwnm6.vercel.app`,
              `Token present: ${process.env.TOKEN_PRESENT}`,
              `Promotion outcome: ${process.env.PROMOTE_OUTCOME || 'not-run'}`,
              `Domain verification: ${process.env.VERIFY_OUTCOME || 'not-run'}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

      - name: Enforce successful promotion
        if: always()
        shell: bash
        env:
          TOKEN_PRESENT: ${{ steps.token.outputs.present }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          test "$TOKEN_PRESENT" = "true" || { echo "VERCEL_TOKEN secret is missing"; exit 1; }
          test "$PROMOTE_OUTCOME" = "success" || { echo "vercel promote failed"; exit 1; }
          test "$VERIFY_OUTCOME" = "success" || { echo "production domain verification failed"; exit 1; }
