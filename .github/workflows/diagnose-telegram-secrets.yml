name: Diagnose Telegram secret availability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-telegram-secrets.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret names only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${VERCEL_TOKEN:-}" ] || missing+=(VERCEL_TOKEN)
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || missing+=(TELEGRAM_BOT_TOKEN)
          if [ -z "${TELEGRAM_CHANNEL_ID:-}" ] && [ -z "${TELEGRAM_CHANNEL_USERNAME:-}" ]; then
            missing+=(TELEGRAM_CHANNEL_ID_OR_USERNAME)
          fi
          if [ "${#missing[@]}" -eq 0 ]; then
            title='BOTANICA Telegram Secrets — ALL SET'
            body='All required GitHub secret names are present. Values remain hidden.'
          else
            title='BOTANICA Telegram Secrets — MISSING'
            body="Missing secret names only: ${missing[*]}. No values were read or reported."
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
